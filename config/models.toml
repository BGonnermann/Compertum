# Section 19 model file: one loopback model for each AI role. Any model can run any role.
# base_url must be http://127.0.0.1:<port> or http://localhost:<port>. Any port works. Other hosts are refused.
# model is the exact ID the server reports at GET /v1/models. The client refuses a server that does not list it.
# LM Studio serves on port 1234 by default. Set the IDs after the first practice run reports them. Strata stays off.

[roles.director]
base_url = "http://127.0.0.1:1234/v1"
model = "SET_FROM_SERVER_MODEL_LIST"

[roles.researcher]
base_url = "http://127.0.0.1:1234/v1"
model = "SET_FROM_SERVER_MODEL_LIST"

[roles.mathematician]
base_url = "http://127.0.0.1:1234/v1"
model = "SET_FROM_SERVER_MODEL_LIST"

[roles.engineer]
base_url = "http://127.0.0.1:1234/v1"
model = "SET_FROM_SERVER_MODEL_LIST"
